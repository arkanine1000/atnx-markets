<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="popup.css">
  <title>ATNX Capture</title>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ATNX</h1>
      <p class="subtitle">Attention Exchange</p>
    </div>

    <div class="section">
      <label for="webAppUrl">Web App URL</label>
      <div class="input-row">
        <input type="url" id="webAppUrl" placeholder="https://atnx.app" autocomplete="off">
        <button id="saveUrl" class="btn-small">Save</button>
      </div>
      <div id="urlStatus" class="status-text"></div>
    </div>

    <div class="section">
      <label for="apiKey">Anthropic API Key</label>
      <div class="input-row">
        <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off">
        <button id="saveKey" class="btn-small">Save</button>
      </div>
      <div id="keyStatus" class="status-text"></div>
    </div>

    <button id="captureBtn" class="btn-capture">
      <span id="captureText">⌘ CAPTURE</span>
    </button>

    <div id="statusBar" class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Ready</span>
    </div>

    <div class="footer">
      <span id="captureCount">0 captures</span>
      <a href="#" id="openDashboard">Open Dashboard →</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
