<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>ATNX Capture</title>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>ATNX</h1>
      <p class="subtitle">Attention Exchange</p>
    </header>

    <form id="urlForm" class="section">
      <label for="webAppUrl">Web App URL</label>
      <div class="input-row">
        <input type="url" id="webAppUrl" placeholder="https://atnx.app" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn-small">Save</button>
      </div>
      <div id="urlStatus" class="status-text" aria-live="polite"></div>
    </form>

    <button id="captureBtn" class="btn-capture" type="button">
      <span id="captureText">CAPTURE</span>
    </button>

    <div class="status-bar" aria-live="polite">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">Ready</span>
    </div>

    <footer class="footer">
      <span id="captureCount">0 captures</span>
      <a href="#" id="shortcutLink" class="shortcut" title="Change shortcut">Ctrl+Shift+X</a>
      <a href="#" id="openDashboard">Dashboard →</a>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
