<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="sidepanel.css">
  <title>ATNX</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- The ATNX mark while signed out; the account's avatar once the
           portfolio has answered with who this is. -->
      <span id="avatar" class="avatar"><img src="icons/icon48.png" width="28" height="28" alt=""></span>
      <span id="handleChip" class="handle muted">Not signed in</span>
    </div>
    <div class="topbar-actions">
      <button id="settingsToggle" class="icon-btn" type="button" title="Settings" aria-label="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.7 7.7 0 0 0-1.7-1L15 3H9l-.3 2.9a7.7 7.7 0 0 0-1.7 1l-2.5-1-2 3.5L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.7 7.7 0 0 0 1.7 1L9 21h6l.3-2.9a7.7 7.7 0 0 0 1.7-1l2.5 1 2-3.5ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      </button>
    </div>
  </header>

  <section id="settings" class="card settings" hidden>
    <!-- Admins only (and anyone already pointed away from the default, so
         they can point back); sidepanel.js reveals it. -->
    <form id="urlForm" hidden>
      <label for="webAppUrl">Web App URL</label>
      <div class="input-row">
        <input type="url" id="webAppUrl" placeholder="https://www.atnx.app" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn-small">Save</button>
      </div>
      <div id="urlStatus" class="status-text" aria-live="polite"></div>
    </form>
    <div class="settings-row">
      <span>Shortcut</span>
      <a href="#" id="shortcutLink" class="kbd" title="Change shortcut">Ctrl+Shift+X</a>
    </div>
    <div class="settings-row muted">
      <span>Version</span>
      <span id="version"></span>
    </div>
  </section>

  <main>
    <section class="capture-hero">
      <button id="captureBtn" class="btn-capture" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
        <span id="captureText">CAPTURE</span>
      </button>
      <div id="captureNote" class="note" hidden></div>
      <!-- The last capture's market, with a way to open it. -->
      <div id="resultNote" class="note result-note" hidden>
        <span id="resultText"></span>
        <span class="result-actions">
          <button id="resultOpen" class="result-open" type="button">Open market →</button>
          <button id="resultDismiss" class="result-dismiss" type="button" aria-label="Dismiss">✕</button>
        </span>
      </div>
      <!-- Shown while signed out: a capture would be analysed and then fail to save. -->
      <div id="authNote" class="note auth-note" hidden></div>
    </section>

    <!-- A proposed capture waiting for the person's choice (the review step). -->
    <section id="review" class="card review" hidden></section>

    <!-- Stat tile: hero value + range delta + chart. Hidden until signed in. -->
    <section id="valueTile" class="card tile" hidden>
      <div class="tile-head">
        <span class="tile-label">Portfolio value</span>
        <span id="tileDelta" class="tile-delta"></span>
      </div>
      <div id="tileValue" class="hero">$0.00</div>
      <div id="chart" class="chart" tabindex="0" role="img" aria-label="Portfolio value over the last 7 days">
        <svg id="chartSvg" aria-hidden="true"></svg>
        <div id="chartTip" class="chart-tip" hidden>
          <strong id="tipValue"></strong>
          <span id="tipTime"></span>
        </div>
      </div>
      <div id="rangeBar" class="range-bar" role="group" aria-label="Chart range">
        <button type="button" class="range-btn" data-range="1d" aria-pressed="false">1D</button>
        <button type="button" class="range-btn" data-range="1w" aria-pressed="true">1W</button>
        <button type="button" class="range-btn" data-range="1m" aria-pressed="false">1M</button>
        <button type="button" class="range-btn" data-range="all" aria-pressed="false">ALL</button>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Portfolio</h2>
        <button id="refreshBtn" class="icon-btn small" type="button" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
        </button>
      </div>
      <div id="portfolio" class="card">
        <div class="placeholder">Loading…</div>
      </div>
      <!-- The result of a close: what it paid, or why it did not happen. -->
      <div id="portfolioNote" class="note trade-note" role="status" aria-live="polite" hidden></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Top markets</h2>
        <span id="marketsMeta" class="muted"></span>
      </div>
      <!-- Rows open the market page, where the wallet and the UP/DOWN ticket are. -->
      <div id="markets" class="card list top">
        <div class="placeholder">Loading…</div>
      </div>
      <div id="marketsNote" class="note trade-note" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <footer class="footer">
    <a href="#" id="openDashboard">Go to ATNX →</a>
  </footer>

  <script src="identicon.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
